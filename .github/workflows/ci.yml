name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore NovaLauncher.sln --locked-mode
      - name: Verify formatting and analyzers
        run: dotnet format NovaLauncher.sln --verify-no-changes --no-restore
      - name: Build Debug
        run: dotnet build NovaLauncher.sln -c Debug --no-restore
      - name: Test Debug
        run: dotnet test NovaLauncher.sln -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/Debug
      - name: Build Release
        run: dotnet build NovaLauncher.sln -c Release --no-restore
      - name: Test Release including Windows smoke
        run: dotnet test NovaLauncher.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/Release
      - name: Dependency vulnerability audit
        run: dotnet list NovaLauncher.sln package --vulnerable --include-transitive
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: TestResults
