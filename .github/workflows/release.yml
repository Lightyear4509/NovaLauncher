name: Build signed release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: ${{ !endsWith(github.ref_name, '-unsigned') }}
    runs-on: windows-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore NovaLauncher.sln --locked-mode
      - name: Verify, build, and test
        shell: pwsh
        run: |
          dotnet format NovaLauncher.sln --verify-no-changes --no-restore --severity warn
          dotnet build NovaLauncher.sln -c Release --no-restore
          dotnet test NovaLauncher.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/Release
          dotnet list NovaLauncher.sln package --vulnerable --include-transitive
      - name: Install pinned signed Inno Setup compiler
        shell: pwsh
        run: |
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          Invoke-WebRequest $uri -OutFile inno.exe
          $signature = Get-AuthenticodeSignature inno.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Invalid Inno Setup signature.' }
          $dir = Join-Path $PWD '.tools\InnoSetup'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $arguments = @(
            '/PORTABLE=1'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=`"$dir`""
          )
          $process = Start-Process -FilePath (Join-Path $PWD 'inno.exe') -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $dir 'ISCC.exe') -PathType Leaf)) {
            throw "Inno Setup portable installation failed with exit code $($process.ExitCode)."
          }
      - name: Build installer, portable ZIP, SBOM, and checksums
        shell: pwsh
        env:
          NOVALAUNCHER_SIGNING_CERTIFICATE_BASE64: ${{ secrets.NOVALAUNCHER_SIGNING_CERTIFICATE_BASE64 }}
          NOVALAUNCHER_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.NOVALAUNCHER_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NOVALAUNCHER_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:NOVALAUNCHER_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Signed releases require the NovaLauncher code-signing certificate and password secrets.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'novalauncher-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:NOVALAUNCHER_SIGNING_CERTIFICATE_BASE64))
          try {
            .\scripts\Build-Release.ps1 -DotNetPath (Get-Command dotnet).Source -SigningCertificatePath $certificatePath -SigningCertificatePassword $env:NOVALAUNCHER_SIGNING_CERTIFICATE_PASSWORD
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed release candidates
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-signed-release
          path: artifacts/release/*
          if-no-files-found: error
